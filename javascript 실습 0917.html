<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>안녕하세요</h1>
    <p>기본 HTML 문서입니다.</p>

    <script>
        // JavaScript 작성


        // 숫자 Math 함수(메소드)들
        num_var = -234;
        console.log(Math.abs(num_var));
        console.log(Math.max(2, 6, 3, 9, 4));
        console.log(Math.min(2, 6, 3, 9, 4));
        console.log(Math.abs(-0.34));
        console.log(Math.random(333));
        console.log(Math.round(235.9));
        console.log(Math.floor(123.4567));
        console.log(Math.ceil(123.4567));
        // 메소드 - 파라미터를 넣을 수 있다. 자료형

        v3 = "123"
        console.log(v3 + 5)
        console.log(v3 + "5")
        console.log(v3 * 5)
        console.log(v3 + 5)
        console.log(Number(v3) + 5)
        console.log(parseInt("1.35"))
        console.log(parseFloat("1.35"))


        v4 = 123
        console.log(v4 + 5)
        console.log(v4 + "5")
        console.log(v4 * 5)
        console.log(String(v4) + 5)
        console.log(5 % 3) // 2
        console.log(5 / 3) // 1



        if (v4 > 100) {
            console.log("100보다 커요.")
        } else {
            console.log("100보다 크지 않아요.")
        }
        if (v4 > 100) {
            console.log("100보다 커요.")
        } else if (v4 < 50) {
            console.log("50보다 작아요.")
        } else {
            console.log("50보다 같거나 크고 100보다 같거나 작아요.")
        }

        v4 = 53
        if (v4 > 100) {
            console.log("100보다 커요.")
        }
        if (v4 < 50) {
            console.log("50보다 작아요.")
        }
        if (!(v4 > 100) && !(v4 < 50)) {
            console.log("50보다 같거나 크고 100보다 같거나 작아요.")
        }

        // 반복문
        arr1 = "apple"
        arr2 = "banana"
        arr3 = "orange"
        console.log(arr1);
        console.log(arr2);
        console.log(arr3);

        arr = ["apple", "banana", "orange"];
        console.log(arr[0]);
        console.log(arr[1]);
        console.log(arr[2]);

//위 [] 배열을 불편한데도 쓰는 이유는 아래와 같이 반복문을 쓸 수 있기 때문
        for (i = 0; i < arr.length; i++) {
            console.log(arr[i]);
        }
        // i=i+2 --- 대입연산자(같다는 뜻이 아님)
        // 비교연산자도 있음. 주로 if랑 함께 쓰임. if ~ else if ~ else
        for(var i in arr) {
            console.log(arr[i]);
        }
        // i에 있는 걸 한번씩 다 꺼내줘

// 오브젝트에서도 반복문을 쓸 수 있다
        var obj = { k1: "seoul"
                     , k2: "daejeon"
                     , k3: 100
                     , k4: ["apple", "banana"]
                  };

        console.log(obj);
        console.log(obj.k1); // 갈아끼우기가 힘듦
        console.log(obj["k1"]);
        console.log(obj["k1"]);
        console.log(obj.k1);
        // 속성명을 알 때: object.
        // 속성명을 모를 때: enhanced for를 이용해서 속성명을 알아와서 object[변수명]
        // 속성들 다 꺼내고 싶을 때: enhanced for 다 보고 싶을 때, 반복문 사용 object["속성명"]
        for (var v1 in obj) {
            console.log(v1);
            console.log(typeof (v1));
            // var v1 = "k1";
            // var v1 = "k2";
            console.log(obj[v1]);
        }






    </script>

</body>

</html>
